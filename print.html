<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>The Middle Shelf · QR card</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=Lora:ital,wght@0,400..600;1,400..600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/menu.css?v=14">
  <style>
    body { overflow: auto; background: #e9e3d6; }
    .wrap { min-height: 100vh; display: grid; place-items: center; padding: 24px 16px; gap: 14px; }
    /* 4 x 6 in card */
    .card { width: 4in; height: 6in; background: var(--paper); position: relative; padding: .16in; box-shadow: 0 6px 24px rgba(0,0,0,.12); }
    .card .frame { height: 100%; margin: 0; padding: .26in .1in; display: flex; }
    .card .sheet { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: space-between; text-align: center; padding: .2in .18in .24in; border-radius: .5in; }
    .card .logo { width: 100%; margin: 0; }
    .scan { font: 400 22px/1.1 var(--display); margin: 0; }
    .sub { font: italic 13px/1.4 var(--serif); color: var(--ink-2); margin: 4px 0 0; }
    .qr { width: 1.7in; height: 1.7in; padding: .08in; border: 1.5px solid var(--ink); border-radius: 12px; background: var(--paper); }
    .qr svg { width: 100%; height: 100%; display: block; }
    .url { font-size: 10px; letter-spacing: .08em; color: var(--muted); word-break: break-all; }
    .tools { display: flex; gap: 10px; align-items: center; font: 13px var(--serif); color: var(--ink-2); flex-wrap: wrap; justify-content: center; }
    .tools button { appearance: none; border: 1.5px solid var(--ink); background: var(--ink); color: var(--paper); border-radius: 999px; padding: 9px 16px; font: 400 14px var(--display); cursor: pointer; }
    @media print {
      @page { size: 4in 6in; margin: 0; }
      body { background: none; }
      .wrap { display: block; padding: 0; min-height: 0; }
      .card { box-shadow: none; }
      .tools { display: none; }
    }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="card">
      <div class="frame"><i class="c tl"></i><i class="c tr"></i><i class="c bl"></i><i class="c br"></i><i class="dots t"></i><i class="dots b"></i>
        <div class="sheet">
          <div id="logo"></div>
          <div><p class="scan">Scan for tonight's menu</p><p class="sub">Cocktails, house originals, and everything open on the shelf.</p></div>
          <div class="qr" id="qr" aria-label="QR code to the menu"></div>
          <div class="url" id="url"></div>
        </div>
      </div>
    </div>
    <div class="tools"><button onclick="window.print()">Print card</button><span>Prints at 4 × 6 in. Choose “Actual size” in the print dialog.</span></div>
  </div>
  <script src="assets/art.js?v=14"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js"></script>
  <script>
    // The QR points at this site's guest menu (or ?url=... to override).
    const target = new URLSearchParams(location.search).get("url") || new URL("./", location.href).href;
    document.getElementById("logo").innerHTML = MSArt.logo();
    document.getElementById("url").textContent = target.replace(/^https?:\/\//, "").replace(/\/$/, "");
    const qr = qrcode(0, "M");
    qr.addData(target);
    qr.make();
    document.getElementById("qr").innerHTML = qr.createSvgTag({ cellSize: 4, margin: 0, scalable: true })
      .replace(/fill="black"/g, 'fill="#1b1815"').replace(/fill="white"/g, 'fill="#f6f2ea"');
  </script>
</body>
</html>
